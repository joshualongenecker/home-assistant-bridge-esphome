name: ESPHome Compilation Test

on:
  push:
    branches:
      - main
      - develop
  # The wrapper guard below only prevents a regression if it runs before merge.
  # Scoped to the inputs that can break it, so a test- or docs-only PR does not
  # pay for a full ESP-IDF compile.
  pull_request:
    paths:
      - 'components/geappliances_bridge/**'
      - 'docs/test-compile*.yaml'
      - 'scripts/check_diagnostic_mqtt_wrappers.py'
      - 'scripts/check_protocol_buffer_defines.py'
      - '.github/workflows/esphome-compile.yml'
  # Weekly (Mondays), so a new ESPHome or Python release is built against even when
  # nothing in the repo changed
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

jobs:
  compile-test:
    name: Compile ESPHome Configuration
    runs-on: ubuntu-latest
    
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Always the newest Python release: ESPHome drops old Pythons, and
          # pip would otherwise quietly install an older ESPHome
          python-version: '3.x'
          check-latest: true

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-esphome-${{ hashFiles('docs/test-compile.yaml', 'components/geappliances_bridge/*.cpp', 'components/geappliances_bridge/*.h') }}
          restore-keys: |
            ${{ runner.os }}-pip-esphome-
            ${{ runner.os }}-pip-

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('docs/test-compile.yaml', 'components/geappliances_bridge/*.cpp', 'components/geappliances_bridge/*.h') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install ESPHome
        run: |
          pip install --upgrade pip
          pip install --upgrade esphome

      - name: Check this is the latest ESPHome
        run: |
          python --version
          installed=$(python -c "import importlib.metadata as m; print(m.version('esphome'))")
          latest=$(curl -fsSL https://pypi.org/pypi/esphome/json | python -c "import json,sys; print(json.load(sys.stdin)['info']['version'])")
          echo "ESPHome installed: $installed, latest on PyPI: $latest"
          if [ "$installed" != "$latest" ]; then
            echo "::error::Installed ESPHome $installed, not the latest $latest (does it need a newer Python?)"
            exit 1
          fi

      - name: Copy test secrets
        run: |
          cp docs/test-secrets.yaml docs/secrets.yaml

      - name: Compile example configuration
        run: |
          esphome compile docs/test-compile.yaml

      - name: Verify diagnostic entities are published over MQTT
        run: python3 scripts/check_diagnostic_mqtt_wrappers.py

      # Rec 9: a single-protocol config must compile out the other protocol's
      # ring buffers. --only-generate is enough here: the check below reads the
      # generated main.cpp, and the C++ side of the guard is covered by
      # `make check-protocol-variants` in test.yml. The variant config declares
      # no secrets, so it needs no docs/secrets.yaml.
      - name: Generate GEA3-only configuration
        run: |
          esphome compile --only-generate docs/test-compile-gea3-only.yaml

      - name: Generate GEA2-only configuration
        run: |
          esphome compile --only-generate docs/test-compile-gea2-only.yaml

      - name: Verify protocol buffer defines track the configured UARTs
        run: |
          python3 scripts/check_protocol_buffer_defines.py \
            docs/.esphome/build/gea-esphome-test \
            docs/.esphome/build/gea-test-gea3-only \
            docs/.esphome/build/gea-test-gea2-only

      - name: Clean up secrets
        if: always()
        run: |
          rm -f docs/secrets.yaml

