name: Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - name: Install CppUTest
      uses: lyricwulf/abc@v1
      with:
        all: cpputest

    - uses: SimenB/github-actions-cpu-cores@v1
      id: cpu-cores

    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    # Fastest gate for the rec 9 build variants: the component must compile
    # with each protocol's ring buffers compiled out, not just with both.
    - run: make check-protocol-variants
    # Same gate under clang. GCC emits neither -Wunused-private-field nor the
    # C++ form of -Wunused-const-variable, so a protocol-gated member left
    # declared outside its #ifdef passes the GCC run above and breaks every
    # macOS build. -fsyntax-only, so this needs no clang sanitizer runtime.
    - run: make check-protocol-variants CXX=clang++

    - run: make test -j${{ steps.cpu-cores.outputs.count }}
    - run: make integration-test -j${{ steps.cpu-cores.outputs.count }}
    # Uninitialized-struct gate. CppUTest allocates size + 2*guard from malloc,
    # so a stray write through a bogus pointer lands inside the ASan-allocated
    # region and no sanitizer reports it: freeing an uninitialized
    # ha_discovery_manager_t showed up only as "Memory corruption (written out
    # of bounds?)" on an unrelated neighbouring object. Forcing deterministic
    # init turns that whole class (free() of a wild pointer, calls through an
    # uninitialized function table) into a deterministic SEGV at the real site.
    # BUILD_DIR must differ from ./build, or make reuses objects compiled
    # without the flag and the gate passes without compiling anything new.
    - run: make integration-test -j${{ steps.cpu-cores.outputs.count }} BUILD_DIR=./build-pattern EXTRA_CXXFLAGS=-ftrivial-auto-var-init=pattern
    # Second gate for the discovery lifecycle claim protocol: ThreadSanitizer
    # checks the happens-before edges of the claim, which the invariant
    # counters in test/tests/discovery_lifecycle_concurrency_test.cpp can only
    # sample probabilistically.
    - run: make test TSAN=1 -j${{ steps.cpu-cores.outputs.count }}

  pytest:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
        check-latest: true

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest jinja2

    - name: Run Python tests
      run: |
        python -m pytest scripts/test_*.py -v

    - name: Check generated files are in sync
      run: bash scripts/check_generated_sync.sh