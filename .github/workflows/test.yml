name: Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - name: Install CppUTest
      uses: lyricwulf/abc@v1
      with:
        all: cpputest

    - uses: SimenB/github-actions-cpu-cores@v1
      id: cpu-cores

    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - run: make test -j${{ steps.cpu-cores.outputs.count }}
    - run: make integration-test -j${{ steps.cpu-cores.outputs.count }}

  pytest:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest jinja2

    - name: Run Python tests
      run: |
        python -m pytest scripts/test_*.py -v

    - name: Check generated files are in sync
      run: bash scripts/check_generated_sync.sh