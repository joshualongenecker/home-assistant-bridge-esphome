name: Feature request
description: Propose new functionality for the bridge
title: "[feature] "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What
      description: What should happen? One or two sentences, in glossary terms where they exist (docs/GLOSSARY.md).
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What problem does this solve? Which appliance, ERD, or scenario motivates it?
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable outcomes that mean this is done. If the change is firmware-facing, say what device verification must show (topics, values, behavior).
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - ha-discovery
        - erd-cache
        - mqtt
        - write-path
        - startup
        - pipeline
        - ci
        - docs
        - other
    validations:
      required: true
